<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unmute</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Un<span>mute</span></div>
    <nav>
      <a href="/" class="active">Patient</a>
      <a href="/enroll.html">Calibrate</a>
      <a href="/nurse.html">Nurse</a>
      <a href="/proof.html">Proof</a>
    </nav>
    <div class="right">
      <span id="userBadge" class="badge user">no user</span>
      <span id="lipBadge" class="badge hidden">lip reader</span>
      <span id="modeBadge" class="badge">…</span>
    </div>
  </header>

  <main class="page grid">
    <section>
      <div id="cam" class="cam">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="darkBanner" class="dark-banner hidden"><span id="darkText">Turn on the bed light: too dark to read lips.</span>
          <button id="lightOff" class="btn small hidden">Screen light off</button></div>
        <div id="recDot" class="rec-dot hidden">● REC</div>
        <div id="camMsg" class="cam-msg">Starting camera…</div>
      </div>
      <button id="recordBtn" class="record-btn" disabled>Hold to record&nbsp;&nbsp;<kbd>Space</kbd></button>

      <details class="settings card" id="settings">
        <summary>Settings</summary>
        <div class="form">
          <label>What can this patient do? (sets everything below in one go)
            <select id="ability">
              <option value="">Choose…</option>
              <option value="touch">Can see and touch a screen: tap the cards, or the touch button for any sentence</option>
              <option value="nod">Can nod, but not use hands: hands-free recording, nod to confirm, first card speaks itself</option>
              <option value="switch">Can press one big button / switch: cards light up one by one</option>
              <option value="blink">Can only blink: hands-free recording, long blink picks the lit card</option>
            </select>
          </label>
          <label>Who is using Unmute (same name as on Calibrate)
            <input id="userInput" type="text" placeholder="e.g. alex" autocomplete="off" />
          </label>
          <label>Care note for context (optional)
            <textarea id="noteInput" placeholder="e.g. post-surgery, cannot eat yet"></textarea>
          </label>
          <label class="row"><input id="geminiToggle" type="checkbox" checked /> Use Gemini re-ranking with bedside context</label>
          <label class="row"><input id="lipToggle" type="checkbox" checked /> Use the open-source lip reader (Auto-AVSR, runs on this laptop; reads any sentence, no calibration)</label>
          <label class="row"><input id="learnToggle" type="checkbox" checked /> Learn from every confirmed sentence (no calibration needed)</label>
          <label class="row"><input id="preAlertToggle" type="checkbox" checked /> Pre-alert the nurse the moment the best guess is urgent, before confirmation</label>
          <label>How does the patient confirm a choice?
            <select id="confirmMode">
              <option value="nod">Nod (shake = next)</option>
              <option value="switch">Button / switch: choices light up one by one, press to pick</option>
              <option value="blink">Long blink: choices light up one by one, close eyes to pick</option>
            </select>
          </label>
          <label>How to record
            <select id="recordMode">
              <option value="hold">Hold the button / Space while mouthing</option>
              <option value="tap">Tap once to start, tap again to stop</option>
              <option value="auto">Hands-free: just mouth it, no button</option>
            </select>
          </label>
          <label class="auto-only">Lip sensitivity (1 = needs big movement, 10 = very sensitive): <span id="sensVal"></span>
            <input id="sens" type="range" min="1" max="10" step="1" />
          </label>
          <label class="auto-only nod-only">Speak the first card by itself after (seconds, 0 = never): <span id="autoConfirmSVal"></span>
            <input id="autoConfirmS" type="range" min="0" max="8" step="0.5" />
          </label>
          <label class="scan-only">Time on each choice (seconds): <span id="scanSVal"></span>
            <input id="scanS" type="range" min="1" max="6" step="0.5" />
          </label>
          <label class="blink-only">Long blink length (seconds): <span id="blinkSVal"></span>
            <input id="blinkS" type="range" min="0.5" max="2" step="0.1" />
          </label>
          <label class="nod-only">Nod threshold (degrees): <span id="pitchTVal"></span>
            <input id="pitchT" type="range" min="3" max="20" step="1" />
          </label>
          <label class="nod-only">Shake threshold (degrees): <span id="yawTVal"></span>
            <input id="yawT" type="range" min="4" max="30" step="1" />
          </label>
          <label class="row"><input id="faceLightToggle" type="checkbox" checked /> When it is too dark, light the patient's face with the screen and brighten the camera image</label>
          <label class="row"><input id="atToggle" type="checkbox" checked /> Show the touch button (drag it anywhere; tap it to pick any sentence)</label>
          <label>Darkness threshold (0–255): <span id="darkTVal"></span>
            <input id="darkT" type="range" min="10" max="120" step="1" />
          </label>
          <div id="debug" class="debug"></div>
        </div>
      </details>
    </section>

    <section class="card">
      <div id="status" class="status">Loading…</div>
      <div id="substatus" class="substatus"></div>
      <div id="choices" class="choices"></div>
      <div id="spoken" class="spoken-big hidden"></div>
      <div id="hint" class="hint"></div>
      <div id="reason" class="reason"></div>
    </section>
  </main>

  <button id="atBtn" class="at-btn" aria-label="Touch board: pick any sentence" title="Drag me anywhere. Tap to pick any sentence.">
    <span class="at-ring"></span><span class="at-dots"><i></i><i></i><i></i><i></i></span>
  </button>
  <div id="atPanel" class="at-panel hidden" role="dialog" aria-modal="true" aria-labelledby="atTitle">
    <div class="at-sheet">
      <div class="at-head">
        <div>
          <div id="atTitle" class="at-title">Tap a sentence to say it</div>
          <div id="atSub" class="at-sub"></div>
        </div>
        <button id="atClose" class="btn at-close">Close <kbd>Esc</kbd></button>
      </div>
      <div id="atGrid" class="at-grid"></div>
    </div>
  </div>

  <div id="urgent" class="urgent hidden">
    <p>URGENT REQUEST</p>
    <h1 id="urgentText"></h1>
    <p id="urgentPush">Alerting the nurse…</p>
    <button id="urgentAck" class="btn">Nurse is here: clear alarm</button>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
